<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的配色小铺</title>
  <link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
  <header>
    <div>
      <h1>我的配色小铺</h1>
      <p>先试颜色，再碰画纸。</p>
    </div>
    <div class="header-actions">
      <nav class="top-tabs" aria-label="主页面">
        <button id="paintPageTab" class="top-tab active">绘画</button>
        <button id="palettePageTab" class="top-tab">画材</button>
      </nav>
      <button id="undoButton" class="quiet" disabled>撤销</button>
      <button id="redoButton" class="quiet" disabled>重做</button>
      <button id="exportButton" class="primary" disabled>导出 PNG</button>
    </div>
  </header>

  <main>
    <aside class="panel left-panel">
      <section id="lineArtSection">
        <button id="openLineDialogButton" class="wide">导入线稿</button>
        <button id="clearLineButton" class="wide">使用空白画布</button>
      </section>

      <div class="palette-tabs" role="tablist" aria-label="调色板功能">
        <button id="paletteTab" class="tab-button active" role="tab">调色板</button>
        <button id="importPaletteTab" class="tab-button" role="tab">导入色卡</button>
      </div>
      <section id="paletteImportSection" hidden>
        <button id="openPaletteDialogButton" class="wide">导入色卡并识别</button>
      </section>

      <section id="paletteSection" class="palette-section">
        <h2>调色板</h2>
        <select id="paletteSelector" aria-label="选择画材"></select>
        <div id="paletteCards" class="palette-cards"></div>
        <p id="paletteEmpty" class="empty-note">还没有导入画材。</p>
      </section>
    </aside>

    <section class="workspace">
      <div class="canvas-toolbar">
        <label>画笔
          <input id="brushSize" type="range" min="1" max="80" value="18">
          <output id="brushOutput">18 px</output>
        </label>
        <div class="zoom-controls" aria-label="画布缩放">
          <button id="zoomOutButton" title="缩小">−</button>
          <button id="fitButton" title="完整显示画布">适合窗口</button>
          <output id="zoomOutput">100%</output>
          <button id="zoomInButton" title="放大">＋</button>
        </div>
        <span class="active-color"><i id="activeColorPreview"></i><span id="activeColorLabel">尚未选择颜色</span></span>
        <button id="fillBackgroundButton">背景填充</button>
      </div>
      <div id="canvasStage" class="canvas-stage">
        <canvas id="paintCanvas" width="1200" height="1200"></canvas>
        <div id="canvasEmpty" class="canvas-empty">
          <strong>当前是空白画布</strong>
          <span>选择颜色后可以直接上色，也可以导入线稿</span>
        </div>
      </div>
      <div id="status" class="status" aria-live="polite">正在读取本地配置…</div>
    </section>

    <aside class="panel right-panel">
      <section id="paletteRgbPanel">
        <h2>颜色调整</h2>
        <div id="paletteColorPreview" class="palette-color-preview" aria-label="颜色预览"></div>
        <p id="selectedPaletteColor" class="path-note">点击一个色号进行调整</p>
        <label class="stacked">R <input id="redValue" type="number" min="0" max="255"></label>
        <label class="stacked">G <input id="greenValue" type="number" min="0" max="255"></label>
        <label class="stacked">B <input id="blueValue" type="number" min="0" max="255"></label>
        <div class="color-wheel-label">颜色选择器</div>
        <canvas id="paletteColorWheel" class="color-wheel" width="220" height="220" role="slider" aria-label="颜色色轮"></canvas>
        <label class="stacked">明度 <input id="paletteBrightness" type="range" min="0" max="100" value="100"></label>
        <button id="savePaletteColorButton" class="primary wide">保存颜色</button>
      </section>
      <section>
        <h2>画布比例</h2>
        <div id="papers" class="paper-grid">
          <button class="paper selected" data-paper="square"><i></i>正方形 <small>1:1</small></button>
          <button class="paper" data-paper="portrait"><i></i>竖版 <small>3:4</small></button>
          <button class="paper" data-paper="landscape"><i></i>横版 <small>4:3</small></button>
        </div>
      </section>

      <section>
        <h2>已用色号</h2>
        <div id="usedColors" class="used-colors"></div>
        <p id="usedEmpty" class="empty-note">还没有笔画。</p>
      </section>

      <section>
        <h2>全局换色</h2>
        <label class="stacked">把
          <select id="replaceFrom"></select>
        </label>
        <label class="stacked">替换为
          <select id="replaceTo"></select>
        </label>
        <button id="replaceButton" class="wide" disabled>替换全部笔画</button>
      </section>
    </aside>
  </main>

  <dialog id="exportDialog">
    <form method="dialog">
      <h2>导出完成图</h2>
      <label class="stacked">文件名
        <input id="exportFilename" value="painting.png" autocomplete="off">
      </label>
      <p id="exportLocation" class="path-note"></p>
      <div class="dialog-actions">
        <button value="cancel" class="quiet">取消</button>
        <button id="confirmExport" value="default" class="primary">导出</button>
      </div>
    </form>
  </dialog>

  <dialog id="lineDialog" class="import-dialog">
    <form method="dialog">
      <h2>导入线稿</h2>
      <div class="path-field" data-kind="line_art">
        <input id="linePath" autocomplete="off" spellcheck="false" aria-label="线稿路径">
        <div class="suggestions" role="listbox"></div>
      </div>
      <div class="dialog-actions">
        <button value="cancel" class="quiet">取消</button>
        <button id="openLineButton" value="default" class="primary">打开线稿</button>
      </div>
    </form>
  </dialog>

  <dialog id="paletteDialog" class="import-dialog">
    <form method="dialog">
      <h2>导入色卡</h2>
      <label class="stacked">画材名称
        <input id="paletteName" autocomplete="off" aria-label="画材名称">
      </label>
      <div class="path-field" data-kind="palette">
        <input id="palettePath" autocomplete="off" spellcheck="false" aria-label="色卡路径">
        <div class="suggestions" role="listbox"></div>
      </div>
      <div class="dialog-actions">
        <button value="cancel" class="quiet">取消</button>
        <button id="recognizeButton" value="default" class="primary">识别色号</button>
      </div>
    </form>
  </dialog>

  <dialog id="paletteEditorDialog" class="palette-editor-dialog">
    <label class="stacked">调色板名称
      <input id="paletteEditorName" autocomplete="off" aria-label="调色板名称">
    </label>
    <div id="palette"></div>
    <p class="empty-note">暂无色号。</p>
    <div class="dialog-actions"><button id="closePaletteEditorButton" class="quiet">完成</button></div>
  </dialog>

  <script src="/app.js?v=4" defer></script>
</body>
</html>
